
name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DESTROY-task1devops to confirm deletion"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: ./terra

concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

jobs:
  terraform-destroy:
    if: ${{ inputs.confirmation == 'DESTROY-task1devops' }}
    runs-on: ubuntu-latest
    environment: terraform-apply

    env:
      ARM_USE_AZUREAD: "true"
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: 2424bafd-38b8-49e5-b23c-bc720c09bc1b
      ARM_TENANT_ID: 6026a14d-b538-47cf-acf6-e2fbaea8816a
      ARM_SUBSCRIPTION_ID: ea408ce5-4b61-4ef4-bd94-25ebca3d88ce

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Destroy Plan
        run: |
          terraform plan -destroy -input=false \
            -var="subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
            -out=destroy.tfplan

          terraform show -no-color destroy.tfplan

      - name: Terraform Destroy
        run: terraform apply -input=false destroy.tfplan
